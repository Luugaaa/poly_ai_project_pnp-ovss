# PnP-OVSS configuration - validated baseline matching the successful original run

# -- Model ---------------------------------------------------------------
model:
  name: "Salesforce/blip-itm-large-flickr"
  device: "auto"
  image_size: 336

# -- Patching strategy ---------------------------------------------------
patching:
  type: "regular"
  regular:
    grid_size: 21  # 21x21 native patches for 336 input

# -- Core pipeline -------------------------------------------------------
pipeline:
  layer: 6
  head: 7
  dropout_rounds: 3        # 3 dropout rounds as stated in section 3.2
  patches_per_drop: 10     # TOP 10 patches dropped per round
  use_full_ensemble: false

# -- Post-processing -----------------------------------------------------
postprocess:
  threshold: 0.15          # Best threshold found in Table 2
  gaussian_sigma: 0.05     # Best sigma found in Table 2
  use_blur: false
  use_dense_crf: true      # Applies Dense CRF as described in section 3.3

# -- Output --------------------------------------------------------------
output:
  dir: "results"
  save_iterations: true

# -- Dataset (for evaluate.py) ------------------------------------------
dataset:
  name: "voc"
  root: "data/voc"
  split: "val"
  download: true
  max_images: null         # null uses the full 1449 VAL images for full replication
  max_samples: null
  min_pixels: null
  classes: null
  seed: 42
