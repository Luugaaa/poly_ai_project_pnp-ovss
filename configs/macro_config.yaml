macro_sweep:
  dataset_name: "chest_xray"
  transformer: "bridgetower"
  target_resolution: 336   # ignored by BridgeTower wrapper (uses native processor size)
  max_eval_samples: 2000
  max_tune_samples: 30

  # Phase 1 defaults for BridgeTower-large (6 cross-modal layers, indices 0-5).
  # Layer 5 (last cross-modal layer) tends to carry the richest cross-modal signal.
  paper_pipeline:
    layer: 5
    head: 3

  # Fallback when head_layer_tuning is skipped (--only-phase patch-tuning without prior Phase 3).
  pinned_pipeline:
    layer: 5
    head: 3

  transfer_configs:
    - "configs/config_paper_baseline.yaml"

  head_layer_tuning:
    run: true
    metrics: ["dice"]

  patch_settings_tuning:
    run: true
    strategies: ["regular_free", "superpixel"]
    # BridgeTower native patch_size=14; at ~288px, native grid is ~20×20.
    # regular_free operates in pixel space, so sizes are independent of patch_size.
    regular_free_sizes: [12, 16, 24]
    # Superpixel counts matched to regular_free patch totals.
    superpixel_segments: [784, 441, 196]
    dropout_iterations_range: [0, 1, 2, 3]   # 0 = no dropout (baseline control)
    threshold_range: [0.05, 0.1, 0.2]
