macro_sweep:
  dataset_name: "chest_xray" # Toggle to "voc" for natural images
  transformer: "blip" # or "bridgetower"
  target_resolution: 336
  max_eval_samples: 200
  max_tune_samples: 30
  transfer_configs:
    - "configs/config_paper_baseline.yaml"
  head_layer_tuning:
    run: true
    metrics: ["clip", "dice"]
  patch_settings_tuning:
    run: true
    regular_grid_sizes: [16, 24, 32]      # G×G pixel-space grid dimensions
    superpixel_segments: [64, 128, 256]   # N target segments for SLIC
    patches_per_drop_range: [5, 10, 20]   # patches removed per dropout round
    dropout_iterations_range: [0, 1, 2, 3] # 0 = baseline (no dropout)
    threshold_range: [0.05, 0.1, 0.2]    # binarisation thresholds
